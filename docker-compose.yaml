services:
  chromote:
    image: ${CHROMOTE_IMAGE:-ghcr.io/ghluuuuuu/browser-fetch-mcp-chromote:latest}
    restart: always
    environment:
      VNCPASS: ${VNCPASS:-P4ssw0rd!}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - chromote-data:/data
    shm_size: "1gb"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9222/json/version || (pkill -f chrome; exit 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      browser-fetch-internal:
        ipv4_address: 172.28.10.10

  web-fetch-mcp:
    image: ${BROWSER_FETCH_MCP_IMAGE:-ghcr.io/ghluuuuuu/browser-fetch-mcp:latest}
    restart: always
    depends_on:
      - chromote
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CDP_ENDPOINT: http://172.28.10.10:9222
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_ACCESS_KEY: ${MCP_ACCESS_KEY:-}
      BROWSER_PROXY_SERVER: ${BROWSER_PROXY_SERVER:-}
      BROWSER_PROXY_USERNAME: ${BROWSER_PROXY_USERNAME:-}
      BROWSER_PROXY_PASSWORD: ${BROWSER_PROXY_PASSWORD:-}
    networks:
      - browser-fetch-internal

volumes:
  chromote-data:

networks:
  browser-fetch-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24
